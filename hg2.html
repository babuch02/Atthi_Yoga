<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herbal Garden</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif, italic ,bold;
      background: linear-gradient(135deg, #eef7e8 0%, #c8d9b4 100%);
      color: #2e4d24;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-wrapper {
      max-width: 600px;
      width: 90%;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.1);
      padding: 40px 36px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
      letter-spacing: 0.08em;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.7;
      margin: 20px auto 32px;
      max-width: 520px;
    }

    .button {
      display: inline-block;
      padding: 16px 28px;
      background: #628a4f;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 18px rgba(98, 138, 79, 0.25);
      background: #556f3f;
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <h1>
        <div>
        Thoothuvalai Plant 
        <div>
            (Solanum trilobatum)
        </div>
        </div>
    </h1>
    <div>
        <img src="thuthu.jpeg" alt="Thoothuvalai Plant" style="margin: 5px auto; display: block; max-width: 70%; height: auto; border-radius: 12px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);">
    </div>
    <button class="button" onclick="window.location.href='hg1.html'" style="margin: 20px auto;">Back to Home</button>
  </div>
</body>
</html>
