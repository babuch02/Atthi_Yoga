<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herbal Garden Welcome</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif, italic;
      background: linear-gradient(135deg, #d8f5e0 0%, #eef7da 50%, #f8f1d8 100%);
      color: #2f4f2f;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      background-image: radial-gradient(circle at top left, rgba(82, 167, 102, 0.2), transparent 35%),
                        radial-gradient(circle at bottom right, rgba(155, 187, 89, 0.18), transparent 30%);
    }

    .hero-content {
      max-width: 900px;
      background: rgba(255, 255, 255, 0.82);
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      padding: 40px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 3rem;
      margin: 0 5 16px;
      letter-spacing: 1px;
         color: #3a5f0b;
         font-weight: 700;  
        font-family:'Georgia', serif, italic;
    }
    h2 {
      font-size: 2.5rem;
      margin: 0 0 24px;
      color: #4b5c40;

    }

    p {
      font-size: 1.15rem;
      line-height: 1.8;
      margin: 0 0 28px;
    }

    .button {
      display: inline-block;
      padding: 16px 28px;
      background: #628a4f;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    .button:hover {
      background: #4f723f;
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-content">
        <h1> Atthi Naturopathy and Yoga Medical College</h1>
        <img src="WhatsApp Image 2026-06-06 at 10.05.15 PM.jpeg" alt="Atthi College" style="margin: 20px auto; display: block; max-width: 60%; height: auto; border-radius: 12px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);">
      <h2>Welcome to the Herbal Garden</h2>
      <p>Click the button below</p>
      <a href="hg3.html" class="button">Explore the Garden</a>
      <div class="leaf-grid" id="herbs">
        </div>
      </div>
    </div>
  </section>
</body>
</html>
